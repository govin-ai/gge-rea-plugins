- insert:
    - id: defensive-file-triage-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: defensive-file-triage
        includeDefaultRoots: false
        watch: false
        customSkillDirs:
          - !!js >-
            process.getBuiltinModule('node:path').join(
              process.getBuiltinModule('node:path').dirname(
                process.getBuiltinModule('node:module').createRequire(baseUrl)
                  .resolve('dsh-defensive-file-triage/package.json')
              ),
              'skills'
            )
